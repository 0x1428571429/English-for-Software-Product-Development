[package]
name = "blurt"
version = "1.0.1"
description = "脱口 — 工程师工作英语训练"
authors = ["0x1428571429"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "blurt_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
